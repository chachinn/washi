name: Apply Washi Auto Dump r13

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/auto-dump-r13.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/washi-auto-dump-r13
          fetch-depth: 0
      - name: Apply Auto Dump update and QA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d948c3f92454ceef42a9fa7a9dda423fff6fa5b7"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f"Expected one match in {path}, found {s.count(old)}")
              p.write_text(s.replace(old, new, 1))

          replace_once('app.js',
            "function action(name){if(name==='new-project')return newProjectModal();if(name==='photo-dump')return $('#photoDumpInput').click();",
            "function action(name){if(name==='new-project')return newProjectModal();if(name==='auto-dump')return $('#autoDumpInput').click();if(name==='photo-dump')return $('#photoDumpInput').click();")

          old_marker = "W.SmartPhotoDump={arrange:arrangePhotoDump,version:'2026.08.14-r12'};"
          new_marker = r"""const AUTO_SW=1080,AUTO_SH=1350,AUTO_MAX=60;
          function autoSlideGroups(total,maxSlides){
            const slides=Math.min(maxSlides,Math.max(2,Math.ceil(total/4))),base=Math.floor(total/slides),rem=total%slides,a=Array.from({length:slides},(_,i)=>base+(i<rem?1:0));
            if(slides>2&&a[0]===a[1]&&a[0]>2&&a[0]<8){a[0]++;a[1]--}return a;
          }
          function autoSlideStyle(o,slide,index){
            if(slide%2===1)o.x=AUTO_SW-o.x-o.w;
            o.x+=slide*AUTO_SW;
            if(slide%3===2){o.rotation=index%2?1.2:-1.2;o.radius=Math.max(o.radius||0,16)}else{o.rotation=0;o.radius=slide%3===1?8:18}
          }
          function autoArrangeSlides(p,media,{video=false}={}){
            const groups=autoSlideGroups(media.length,video?8:6),backgrounds=['#fff8fb','#f4f0e8','#eef4f0','#f5eef8','#f9f3e9','#eef1f8'],bgObjects=[];
            p.width=AUTO_SW*groups.length;p.height=AUTO_SH;p.format='portrait';p.autoDumpLayout=true;p.autoGenerated=true;p.autoOutput=video?'video':'carousel';
            p.carousel={enabled:true,slideCount:groups.length,slideWidth:AUTO_SW,slideHeight:AUTO_SH,durations:Array(groups.length).fill(video?2.5:3),activeSlide:0,view:'slide'};
            p.name=video?`Auto Video · ${media.length} photos`:`Auto Carousel · ${media.length} photos`;
            let offset=0;
            groups.forEach((count,slide)=>{
              bgObjects.push({id:DB.uid('obj'),type:'shape',shape:'rect',x:slide*AUTO_SW,y:0,w:AUTO_SW,h:AUTO_SH,fill:backgrounds[slide%backgrounds.length],border:'transparent',borderWidth:0,radius:0,opacity:1,rotation:0,visible:true,locked:true,autoBackground:true});
              const chunk=media.slice(offset,offset+count),rs=dumpRects(count,AUTO_SW,AUTO_SH);
              chunk.forEach((o,i)=>{const r=rs[i];Object.assign(o,{x:r.x,y:r.y,w:r.w,h:r.h,fit:'cover',focusX:o.focusX??50,focusY:o.focusY??50,mediaZoom:o.mediaZoom??1});autoSlideStyle(o,slide,i)});
              offset+=count;
            });
            p.objects=[...bgObjects,...p.objects];return groups;
          }
          async function makeAutoDump(files){
            const picked=[...(files||[])].filter(f=>f.type.startsWith('image/')).slice(0,AUTO_MAX);if(!picked.length)return;
            say(`Auto-arranging ${picked.length} photo${picked.length===1?'':'s'}…`);E.createProject('dump',`Auto Dump · ${picked.length} photos`);
            const added=await E.addMedia(picked);if(!added.length)throw Error('No compatible photos');const p=E.getProject();
            if(added.length<=12){p.name=`Auto Collage · ${added.length} photos`;p.autoGenerated=true;p.autoOutput='collage';p.autoDumpLayout=true;arrangePhotoDump(p,added,{save:false})}
            else autoArrangeSlides(p,added,{video:added.length>=25});
            E.state.selectedId=null;E.render();E.save();tool='add';route('editor');setTimeout(()=>closePanel(),120);
            say(added.length>=25?'Auto video ready — export whenever you want':added.length>=13?'Auto carousel ready':'Auto collage ready');
          }
          W.SmartPhotoDump={arrange:arrangePhotoDump,auto:makeAutoDump,version:'2026.08.14-r13'};"""
          replace_once('app.js', old_marker, new_marker)

          old_listener = "$('#photoDumpInput').addEventListener('change',async e=>{const files=[...e.target.files].slice(0,12);if(files.length)try{await makeDump(files)}catch{say('Could not build photo dump')}e.target.value=''});"
          new_listener = old_listener + "\n$('#autoDumpInput').addEventListener('change',async e=>{const all=[...e.target.files],files=all.slice(0,AUTO_MAX);if(files.length)try{await makeAutoDump(files);if(all.length>AUTO_MAX)say(`Used the first ${AUTO_MAX} photos to keep Washi smooth`)}catch(err){say(err?.name==='QuotaExceededError'?'Not enough local storage':'Could not build Auto Dump')}e.target.value=''});"
          replace_once('app.js', old_listener, new_listener)

          replace_once('app.js',
            '• Photo dump generator and palette extraction<br>',
            '• Auto Dump: choose photos once and Washi builds the layout<br>• Photo dump generator and palette extraction<br>')

          replace_once('index.html',
            '<button class="quick-card" data-action="photo-dump"><span>🎞️</span><b>Photo Dump</b><small>Choose photos; Washi arranges them.</small></button>',
            '<button class="quick-card" data-action="auto-dump"><span>✨</span><b>Auto Dump</b><small>Choose photos once; Washi decides collage, carousel, or video.</small></button>')

          replace_once('index.html',
            '<button data-action="photo-dump">Photo Dump Generator <span>›</span></button>',
            '<button data-action="auto-dump">Auto Dump <span>›</span></button><button data-action="photo-dump">Photo Dump Generator <span>›</span></button>')

          replace_once('index.html',
            '<input type="file" id="photoDumpInput" accept="image/*" multiple hidden />',
            '<input type="file" id="autoDumpInput" accept="image/*" multiple hidden />\n<input type="file" id="photoDumpInput" accept="image/*" multiple hidden />')

          p=Path('index.html');s=p.read_text();p.write_text(s.replace('20260814r12','20260814r13'))
          p=Path('manifest.json');s=p.read_text();p.write_text(s.replace('20260814r12','20260814r13'))
          p=Path('sw.js');s=p.read_text();p.write_text(s.replace('washi-shell-r12-clean','washi-shell-r13-clean'))
          PY

          node --check app.js
          git diff --check
          grep -q "data-action=\"auto-dump\"" index.html
          grep -q "id=\"autoDumpInput\"" index.html
          grep -q "Auto Collage" app.js
          grep -q "Auto Carousel" app.js
          grep -q "Auto Video" app.js
          grep -q "2026.08.14-r13" app.js
          grep -q "20260814r13" index.html
          grep -q "washi-shell-r13-clean" sw.js
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "app.js index.html manifest.json sw.js "

          node <<'NODE'
          function groups(total,maxSlides){const slides=Math.min(maxSlides,Math.max(2,Math.ceil(total/4))),base=Math.floor(total/slides),rem=total%slides,a=Array.from({length:slides},(_,i)=>base+(i<rem?1:0));if(slides>2&&a[0]===a[1]&&a[0]>2&&a[0]<8){a[0]++;a[1]--}return a}
          for(let n=13;n<=24;n++){const a=groups(n,6);if(a.reduce((x,y)=>x+y,0)!==n||a.length>6||a.some(x=>x<1||x>8))process.exit(1)}
          for(let n=25;n<=60;n++){const a=groups(n,8);if(a.reduce((x,y)=>x+y,0)!==n||a.length>8||a.some(x=>x<1||x>8))process.exit(1)}
          console.log('Auto Dump grouping QA passed 13–60 photos')
          NODE

          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git add app.js index.html manifest.json sw.js
          git commit -m "Add automatic photo dump creation"
          git push origin HEAD:agent/washi-auto-dump-r13
